name: CI
# T12: npm dependency cache keyed on team-site/package-lock.json via setup-node.
# Both lint and build jobs use 'npm ci' (lockfile-deterministic installs).

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Secret Scan (T27)
        run: |
          if rg '-----BEGIN .*PRIVATE KEY-----|github_pat_|ghp_|GOCSPX-' .; then
            echo "T27 secret pattern found"
            exit 1
          fi
          echo "T27 secret scan passed"

      - name: Lint (TypeScript type check)
        run: npm run lint
        working-directory: team-site

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          VITE_FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS }}
        run: npm run build
        working-directory: team-site

      - name: Check release readiness
        run: npm run check:readiness
        working-directory: team-site

      - name: Generate status file
        run: |
          cat > team-site/dist/status << 'EOF'
          {
            "team": "PIKK",
            "members": ["Nirmana Pansilu", "Isiwara Mallawaarachchi", "Kavindu Mihisara", "Kavindu Jayalath"],
            "commit": "${{ github.sha }}",
            "release_id": "${{ github.run_id }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "task": "T01",
            "public_url": "http://20.230.193.11"
          }
          EOF

      - name: Fetch weather data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: ${{ vars.OPENWEATHER_CITY }}
        run: |
          set -euo pipefail
          mkdir -p team-site/dist/api
          city="${OPENWEATHER_CITY:-Colombo}"
          http_code="$(curl -sS -o /tmp/ow.json -w '%{http_code}' \
            --get "https://api.openweathermap.org/data/2.5/weather" \
            --data-urlencode "q=${city}" \
            --data-urlencode "units=metric" \
            --data-urlencode "appid=${OPENWEATHER_API_KEY}")"
          if [ "$http_code" != "200" ]; then
            echo "OpenWeather request failed with HTTP ${http_code}"
            exit 1
          fi
          jq --arg city "$city" --arg fetched "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            provider: "openweather",
            task: "T07",
            city: $city,
            fetched_at: $fetched,
            temperature_c: .main.temp,
            feels_like_c: .main.feels_like,
            humidity: .main.humidity,
            conditions: .weather[0].main,
            description: .weather[0].description,
            icon: .weather[0].icon
          }' /tmp/ow.json > team-site/dist/api/weather
          cat team-site/dist/api/weather

      - name: Add weather provider evidence to status
        run: |
          set -euo pipefail
          jq '. + {weather: {provider: "openweather", endpoint: "/api/weather", key_exposed: false}}' \
            team-site/dist/status > /tmp/status.json
          mv /tmp/status.json team-site/dist/status
          cat team-site/dist/status

      - name: Add feature flag evidence to status and config
        env:
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS }}
        run: |
          set -euo pipefail
          # Generate the runtime config JSON (served at /config/feature-flags.json)
          mkdir -p team-site/dist/config
          cat > team-site/dist/config/feature-flags.json << EOF
          {
            "task": "T15",
            "flagName": "FEATURE_SHOW_INSIGHTS",
            "showInsights": $(if [ "$FEATURE_SHOW_INSIGHTS" == "true" ]; then echo "true"; else echo "false"; fi),
            "valueRedacted": true
          }
          EOF
          
          # Add redacted evidence to status
          jq --arg flag "${FEATURE_SHOW_INSIGHTS}" '. + {featureFlags: {task: "T15", flagName: "FEATURE_SHOW_INSIGHTS", showInsights: ($flag == "true"), valueRedacted: true}}' \
            team-site/dist/status > /tmp/status2.json
          mv /tmp/status2.json team-site/dist/status
          cat team-site/dist/status
      - name: Add email alert evidence to status
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          configured="false"
          [ -n "${RESEND_API_KEY:-}" ] && configured="true"
          jq --argjson cfg "$configured" '. + {emailAlert: {task: "T16", provider: "resend", configured: $cfg, secretRedacted: true}}' \
            team-site/dist/status > /tmp/status3.json
          mv /tmp/status3.json team-site/dist/status
          cat team-site/dist/status

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist