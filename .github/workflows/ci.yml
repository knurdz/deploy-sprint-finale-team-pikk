name: CI
# T12: npm dependency cache keyed on team-site/package-lock.json via setup-node.
# Both lint and build jobs use 'npm ci' (lockfile-deterministic installs).

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Lint (TypeScript type check)
        run: npm run lint
        working-directory: team-site

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: npm run build
        working-directory: team-site

      - name: Generate status file
        run: |
          cat > team-site/dist/status << 'EOF'
          {
            "team": "PIKK",
            "members": ["Nirmana Pansilu", "Isiwara Mallawaarachchi", "Kavindu Mihisara", "Kavindu Jayalath"],
            "commit": "${{ github.sha }}",
            "release_id": "${{ github.run_id }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "task": "T01",
            "public_url": "http://20.230.193.11"
          }
          EOF

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist
