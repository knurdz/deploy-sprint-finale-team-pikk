name: Rollback Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Commit SHA of the known-good state to restore'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore known-good release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request rollback from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ inputs.release_ref }}
          TEAM_BRANCH: "main"
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${TEAM_SHA}" = "fail" ]; then
            echo "Intentional diagnostic failure"
            exit 1
          fi

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-pikk-main-merged",
              "client_payload": {
                  "team": "pikk",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "is_rollback": True
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer rollback for ${TEAM_REPO} to restore known-good state at ${TEAM_SHA}."
