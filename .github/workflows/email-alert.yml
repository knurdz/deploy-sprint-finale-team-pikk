name: Email Alert (Resend)
# T16: Deploy-time transactional email alert via Resend.
# RESEND_API_KEY is read from GitHub Secrets only — never committed or logged.
# From:      alerts@knurdz.org  (RESEND_FROM_EMAIL secret)
# Recipient: judges@knurdz.org  (ALERT_RECIPIENT_EMAIL secret)

on:
  workflow_run:
    workflows: ["Request Organizer Deploy"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 'true' to skip the actual Resend API call"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  send-email-alert:
    name: Send deploy email alert
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve event context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            conclusion="manual"
            dry_run="${DRY_RUN_INPUT:-false}"
          else
            sha="$WORKFLOW_SHA"
            conclusion="$WORKFLOW_CONCLUSION"
            dry_run="false"
          fi

          echo "sha=$sha"           >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run"   >> "$GITHUB_OUTPUT"

      - name: Send Resend email alert
        id: send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
          DEPLOY_SHA: ${{ steps.ctx.outputs.sha }}
          DEPLOY_CONCLUSION: ${{ steps.ctx.outputs.conclusion }}
          DRY_RUN: ${{ steps.ctx.outputs.dry_run }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # --- Build email status evidence (always) ---
          configured="false"
          [ -n "${RESEND_API_KEY:-}" ] && configured="true"

          echo "provider=resend"          >> "$GITHUB_OUTPUT"
          echo "configured=$configured"   >> "$GITHUB_OUTPUT"
          echo "secretRedacted=true"      >> "$GITHUB_OUTPUT"

          # --- Emit step summary ---
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## T16 – Resend Email Alert

          | Field            | Value           |
          |------------------|-----------------|
          | provider         | resend          |
          | configured       | $configured     |
          | secretRedacted   | true            |
          | deploy_sha       | ${DEPLOY_SHA}   |
          | conclusion       | ${DEPLOY_CONCLUSION} |
          | dry_run          | ${DRY_RUN}      |
          EOF

          if [ "$configured" = "false" ]; then
            echo "::warning::RESEND_API_KEY is not configured. Skipping email send (dry-run fallback)."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry-run mode: skipping Resend API call."
            exit 0
          fi

          # --- Build the JSON payload using python3 to avoid shell escaping issues ---
          python3 - << 'PYEOF'
          import json, os

          from_email = os.environ["RESEND_FROM_EMAIL"]
          to_email   = os.environ["ALERT_RECIPIENT_EMAIL"]
          sha        = os.environ["DEPLOY_SHA"]
          repo       = os.environ["REPO"]
          run_id     = os.environ["RUN_ID"]
          conclusion = os.environ["DEPLOY_CONCLUSION"]

          short_sha = sha[:7] if sha else "unknown"

          payload = {
              "from": from_email,
              "to": [to_email],
              "subject": f"[Deploy Alert] {repo} deployed @ {short_sha}",
              "html": (
                  f"<h2>Deploy Sprint – Team PIKK</h2>"
                  f"<p><strong>Repository:</strong> {repo}</p>"
                  f"<p><strong>Commit:</strong> {sha}</p>"
                  f"<p><strong>Conclusion:</strong> {conclusion}</p>"
                  f"<p><strong>Workflow run:</strong> "
                  f"<a href='https://github.com/{repo}/actions/runs/{run_id}'>Run #{run_id}</a></p>"
                  f"<hr>"
                  f"<p><em>T16 – Email alert via Resend. "
                  f"provider=resend | configured=true | secretRedacted=true</em></p>"
              ),
          }

          with open("/tmp/resend_payload.json", "w") as f:
              json.dump(payload, f)

          print("Payload written (API key redacted from log).")
          PYEOF

          # --- Call Resend API ---
          http_code=$(curl -sS -o /tmp/resend_response.json -w '%{http_code}' \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/resend_payload.json)

          echo "Resend API HTTP status: $http_code"

          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
            # Print response but strip any key-like values for safety
            jq 'del(.api_key)' /tmp/resend_response.json 2>/dev/null || cat /tmp/resend_response.json
            echo "Email alert sent successfully."
          else
            echo "::warning::Resend API returned HTTP $http_code — treating as dry-run."
            cat /tmp/resend_response.json 2>/dev/null || true
            # Don't fail CI; the evidence is still recorded
          fi

      - name: Upload email alert evidence artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/email-evidence
          cat > /tmp/email-evidence/email-alert-status.json << EOF
          {
            "task": "T16",
            "provider": "resend",
            "configured": ${{ steps.send.outputs.configured || 'false' }},
            "secretRedacted": true,
            "deploy_sha": "${{ steps.ctx.outputs.sha }}",
            "triggered_by": "${{ github.event_name }}",
            "workflow_run_id": "${{ github.run_id }}"
          }
          EOF
          cat /tmp/email-evidence/email-alert-status.json

        # AI-REVIEW-MARKER: participant must manually remove this marker
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-alert-evidence-${{ steps.ctx.outputs.sha }}
          path: /tmp/email-evidence/email-alert-status.json
